<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#c97b2a,#1d1d4f);;
            padding:20px;
        }

        .container{
            width:400px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        form label{
            font-weight:bold;
        }

        form input,
        form select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid gray;
            border-radius:8px;
        }

        .gender{
            margin-bottom:15px;
        }

        .gender input{
            width:auto;
        }

        .checkbox{
            margin-bottom:20px;
        }

        .checkbox input{
            width:auto;
        }

        .buttons{
            display:flex;
            justify-content:space-between;
        }

        .buttons button{
            width:48%;
            padding:10px;
            border:none;
            border-radius:8px;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .register{
            background:green;
        }

        .reset{
            background:red;
        }

        .login{
            text-align:center;
            margin-top:15px;
        }

        .login a{
            text-decoration:none;
            color:blue;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>REGISTRATION FORM</h2>

        <form>
            
            <label>Username:</label>
            <input type="text" placeholder="Enter Username">

            <label>Email</label>
            <input type="email" placeholder="Enter Email">

            <label>Phone Number</label>
            <input type="number" placeholder="Enter Phone Number">

            <label>Password</label>
            <input type="password" placeholder="Enter Password">

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm Password">

            <div class="gender">
                <label>Gender :</label><br><br>

                <input type="radio" name="gender"> Male

                <input type="radio" name="gender"> Female

            </div>

            <label for ="date_time">Date and Time:</label>
            <input type="datetime-local" id="date_time" name="date_time" required>

            <label>Quiz Category</label>

            <select>
                <option>Select Category</option>
                <option>Html</option>
                <option>Css</option>
                <option>JavaScript</option>
            </select>

            <div class="checkbox">
                <input type="checkbox">
                Accept Terms & Conditions
            </div>

            <div class="buttons">

                <button class="register">Register</button>

                <button class="reset" type="reset">Reset</button>

            </div>

            <div class="login">
                Already have account?
                <a href="#">Login</a>
            </div>

        </form>

    </div>

</body>
</html>
